<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo de Comentarios - Red Dead Redemption 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4a6ee0 0%, #6a11cb 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .upload-section {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            background: #f8f9ff;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .file-input {
            margin: 20px 0;
        }
        
        input[type="file"] {
            padding: 10px;
            background: #f8f9ff;
            border-radius: 5px;
            border: 1px solid #ddd;
            width: 100%;
            max-width: 300px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: inline-block;
            text-decoration: none;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
        }
        
        .winner-section {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        
        .winner-name {
            font-size: 2.5em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .participants-list {
            max-height: 300px;
            overflow-y: auto;
            background: white;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #e0e0e0;
        }
        
        .participant-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .participant-item:last-child {
            border-bottom: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        
        .success {
            color: #155724;
            background: #d4edda;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .file-name {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .info-box {
            background: #e8f4fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Sorteo de Comentarios - Red Dead Redemption 2</h1>
            <p>Solo participa un comentario por persona</p>
        </div>
        
        <div class="content">
            <div class="upload-section">
                <div class="upload-icon">📁</div>
                <h2>Subir Archivo CSV</h2>
                
                             
                <div class="file-input">
                    <input type="file" id="csvFile" accept=".csv">
                    <div class="file-name" id="fileName"></div>
                </div>
                
                <button id="uploadBtn" class="btn" onclick="uploadFile()">
                    📤 Subir y Procesar Archivo
                </button>
                
                <div class="loading" id="uploadLoading">
                    <div class="spinner"></div>
                    <p>Procesando archivo...</p>
                </div>
                
                <div class="error" id="uploadError"></div>
            </div>
            
            <div class="results" id="resultsSection">
                <div class="success" id="uploadSuccess"></div>
                
                <div id="participantsInfo">
                    <h3>📋 Lista de Participantes</h3>
                    <p>Total: <span id="totalCount">0</span> participantes encontrados</p>
                    
                    <div class="participants-list" id="participantsList">
                        <!-- Los nombres se cargarán aquí -->
                    </div>
                </div>
                
                <div style="text-align: center; margin: 30px 0;">
                    <button id="sorteoBtn" class="btn" onclick="realizarSorteo()">
                        🎉 Realizar Sorteo Aleatorio
                    </button>
                </div>
                
                <div class="loading" id="sorteoLoading">
                    <div class="spinner"></div>
                    <p>Seleccionando ganador...</p>
                </div>
            </div>
            
            <div class="winner-section" id="winnerSection">
                <h2>🎊 ¡GANADOR DEL SORTEO! 🎊</h2>
                <div class="winner-name" id="winnerName"></div>
                <p>De un total de <span id="winnerTotal">0</span> participantes</p>
                <button class="btn" onclick="location.reload()" style="margin-top: 20px;">
                    🔄 Hacer Otro Sorteo
                </button>
            </div>
        </div>
    </div>

    <script>
        let participantes = [];
        
        // Mostrar nombre del archivo seleccionado
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const fileName = this.files[0] ? this.files[0].name : 'No se seleccionó archivo';
            document.getElementById('fileName').textContent = `Archivo: ${fileName}`;
        });
        
        function uploadFile() {
            const fileInput = document.getElementById('csvFile');
            const uploadBtn = document.getElementById('uploadBtn');
            const loading = document.getElementById('uploadLoading');
            const errorDiv = document.getElementById('uploadError');
            
            if (!fileInput.files.length) {
                showError('Por favor, selecciona un archivo CSV');
                return;
            }
            
            const file = fileInput.files[0];
            
            if (!file.name.toLowerCase().endsWith('.csv')) {
                showError('Solo se permiten archivos CSV');
                return;
            }
            
            // Mostrar loading y ocultar errores
            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            uploadBtn.disabled = true;
            
            // Leer el archivo CSV localmente
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const contenido = e.target.result;
                    participantes = procesarCSVSimple(contenido);
                    
                    if (participantes.length === 0) {
                        showError('No se encontraron datos en las columnas especificadas.');
                        loading.style.display = 'none';
                        uploadBtn.disabled = false;
                        return;
                    }
                    
                    mostrarResultados(participantes);
                    loading.style.display = 'none';
                    uploadBtn.disabled = false;
                    
                } catch (error) {
                    showError('Error al procesar el archivo: ' + error.message);
                    loading.style.display = 'none';
                    uploadBtn.disabled = false;
                }
            };
            
            reader.onerror = function() {
                showError('Error al leer el archivo');
                loading.style.display = 'none';
                uploadBtn.disabled = false;
            };
            
            reader.readAsText(file, 'UTF-8');
        }
        
        function procesarCSVSimple(csvText) {
            const participantesSet = new Set(); // Para evitar duplicados
            const lineas = csvText.split('\n').filter(linea => linea.trim() !== '');
            
            if (lineas.length === 0) return [];
            
            // Obtener encabezados
            const encabezados = parseCSVLine(lineas[0]).map(h => h.trim());
            
            // Buscar índices de las 3 columnas específicas
            const columnasBuscadas = [
                'x1i10hfl',
                'css-j43fir-5e6d46e3--StyledUserLinkContent',
                'xjp7ctv'
            ];
            
            const indicesEncontrados = [];
            
            // Buscar cada columna en los encabezados (búsqueda exacta o parcial)
            for (const columnaBuscada of columnasBuscadas) {
                for (let i = 0; i < encabezados.length; i++) {
                    if (encabezados[i].includes(columnaBuscada)) {
                        indicesEncontrados.push(i);
                        console.log(`Encontrada columna: ${columnaBuscada} en índice ${i}`);
                        break;
                    }
                }
            }
            
            // Si no encontramos ninguna columna, buscar de forma más flexible
            if (indicesEncontrados.length === 0) {
                // Buscar cualquier columna que contenga partes de los nombres
                for (let i = 0; i < encabezados.length; i++) {
                    const encabezado = encabezados[i].toLowerCase();
                    if (encabezado.includes('x1i10hfl') || 
                        encabezado.includes('css-j43fir') || 
                        encabezado.includes('xjp7ctv') ||
                        encabezado.includes('user') ||
                        encabezado.includes('nombre') ||
                        encabezado.includes('username')) {
                        indicesEncontrados.push(i);
                        console.log(`Encontrada columna alternativa: ${encabezados[i]} en índice ${i}`);
                    }
                }
            }
            
            // Ordenar índices para procesar en orden
            indicesEncontrados.sort((a, b) => a - b);
            
            if (indicesEncontrados.length === 0) {
                console.log('No se encontraron las columnas especificadas');
                return [];
            }
            
            // Procesar cada línea del CSV (empezando desde la fila 1)
            for (let i = 1; i < lineas.length; i++) {
                try {
                    const columnas = parseCSVLine(lineas[i]);
                    
                    // Revisar cada columna buscada
                    for (const indice of indicesEncontrados) {
                        if (indice < columnas.length) {
                            const valor = columnas[indice] ? columnas[indice].trim() : '';
                            
                            if (valor !== '' && valor.length > 1) {
                                // Limpiar el valor (remover comillas extras, espacios)
                                const nombreLimpio = valor
                                    .replace(/^["']|["']$/g, '') // Remover comillas al inicio/fin
                                    .replace(/^\s+|\s+$/g, '')   // Remover espacios
                                    .replace(/^@/, '')           // Remover @ si existe al inicio
                                    .slice(0, 100);              // Limitar longitud
                                
                                if (nombreLimpio && nombreLimpio.length > 0) {
                                    participantesSet.add(nombreLimpio);
                                    // Solo tomar el primer valor encontrado por fila
                                    break;
                                }
                            }
                        }
                    }
                    
                } catch (error) {
                    console.log(`Error en línea ${i}:`, error);
                    continue;
                }
            }
            
            // Convertir Set a Array y ordenar alfabéticamente
            return Array.from(participantesSet).sort((a, b) => a.localeCompare(b));
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];
                
                if (char === '"' && !inQuotes) {
                    inQuotes = true;
                } else if (char === '"' && inQuotes && nextChar === '"') {
                    current += '"';
                    i++; // Saltar la siguiente comilla
                } else if (char === '"' && inQuotes) {
                    inQuotes = false;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            
            result.push(current);
            return result;
        }
        
        function mostrarResultados(nombres) {
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('totalCount').textContent = nombres.length;
            document.getElementById('uploadSuccess').textContent = 
                `✅ Se encontraron ${nombres.length} participantes únicos`;
            document.getElementById('uploadSuccess').style.display = 'block';
            
            // Mostrar lista
            const participantsList = document.getElementById('participantsList');
            participantsList.innerHTML = '';
            
            const displayCount = Math.min(50, nombres.length);
            for (let i = 0; i < displayCount; i++) {
                const div = document.createElement('div');
                div.className = 'participant-item';
                div.textContent = `${i + 1}. ${nombres[i]}`;
                participantsList.appendChild(div);
            }
            
            if (nombres.length > 50) {
                const div = document.createElement('div');
                div.className = 'participant-item';
                div.textContent = `... y ${nombres.length - 50} participantes más`;
                div.style.fontStyle = 'italic';
                div.style.color = '#666';
                participantsList.appendChild(div);
            }
            
            // Desplazar hacia la sección de resultados
            document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
        }
        
        function realizarSorteo() {
            if (!participantes.length) {
                alert('No hay participantes para el sorteo');
                return;
            }
            
            const sorteoBtn = document.getElementById('sorteoBtn');
            const loading = document.getElementById('sorteoLoading');
            
            // Mostrar loading
            loading.style.display = 'block';
            sorteoBtn.disabled = true;
            
            // Simular sorteo con delay dramático
            let contador = 3;
            const intervalo = setInterval(() => {
                if (contador > 0) {
                    document.querySelector('#sorteoLoading p').textContent = 
                        `Seleccionando ganador... ${contador}`;
                    contador--;
                } else {
                    clearInterval(intervalo);
                    
                    const ganador = participantes[Math.floor(Math.random() * participantes.length)];
                    loading.style.display = 'none';
                    sorteoBtn.disabled = false;
                    mostrarGanador(ganador, participantes.length);
                }
            }, 500);
        }
        
        function mostrarGanador(ganador, total) {
            // Ocultar sección de resultados
            document.getElementById('resultsSection').style.display = 'none';
            
            // Mostrar sección de ganador
            const winnerSection = document.getElementById('winnerSection');
            const winnerName = document.getElementById('winnerName');
            const winnerTotal = document.getElementById('winnerTotal');
            
            winnerName.textContent = ganador;
            winnerTotal.textContent = total;
            winnerSection.style.display = 'block';
            
            // Desplazar hacia el ganador
            winnerSection.scrollIntoView({ behavior: 'smooth' });
            
            // Efecto de confeti
            crearConfeti();
        }
        
        function crearConfeti() {
            // Efecto simple de confeti
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.background = getRandomColor();
                    confetti.style.borderRadius = '50%';
                    confetti.style.top = '0';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.zIndex = '9999';
                    document.body.appendChild(confetti);
                    
                    // Animación
                    const animation = confetti.animate([
                        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                        { transform: `translateY(${window.innerHeight}px) rotate(${360}deg)`, opacity: 0 }
                    ], {
                        duration: 1000 + Math.random() * 2000,
                        easing: 'cubic-bezier(0.215, 0.610, 0.355, 1)'
                    });
                    
                    animation.onfinish = () => confetti.remove();
                }, i * 30);
            }
        }
        
        function getRandomColor() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff9900', '#ff66cc'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        function showError(mensaje) {
            const errorDiv = document.getElementById('uploadError');
            errorDiv.textContent = mensaje;
            errorDiv.style.display = 'block';
        }
        
        // Permitir arrastrar y soltar archivos
        document.addEventListener('DOMContentLoaded', function() {
            const uploadSection = document.querySelector('.upload-section');
            
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadSection.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                uploadSection.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                uploadSection.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                uploadSection.style.background = '#f0f4ff';
                uploadSection.style.borderColor = '#4a6ee0';
            }
            
            function unhighlight() {
                uploadSection.style.background = '';
                uploadSection.style.borderColor = '#667eea';
            }
            
            uploadSection.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                
                if (files.length) {
                    const file = files[0];
                    if (file.name.toLowerCase().endsWith('.csv')) {
                        document.getElementById('csvFile').files = files;
                        document.getElementById('fileName').textContent = `Archivo: ${file.name}`;
                        uploadFile();
                    } else {
                        showError('Solo se permiten archivos CSV');
                    }
                }
            }
        });
    </script>
</body>
</html>
